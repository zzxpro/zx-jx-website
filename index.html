<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zx-jx.top</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #eee;
            padding: 32px;
            max-width: 920px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 32px;
            font-size: 28px;
            text-align:center;
        }
        .nav-box{
            text-align:center;
            margin-bottom:40px;
        }
        .nav-box a{
            display:inline-block;
            padding:10px 18px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
            margin:0 8px;
        }
        .nav-box a:hover{
            background:#1d4ed8;
        }
        /* 树形目录样式 */
        .tree{
            line-height:1.8;
        }
        .tree-item{
            margin:8px 0;
        }
        .tree-toggle{
            cursor:pointer;
            user-select:none;
            font-size:18px;
            padding:4px 0;
        }
        .tree-toggle:hover{
            color:#60a5fa;
        }
        .tree-children{
            padding-left:24px;
            display:none;
        }
        .tree-children.open{
            display:block;
        }
        .file-item {
            background: #272727;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap:12px;
            margin:10px 0;
        }
        .pdf-icon{
            font-size:20px;
        }
        .file-item a{
            color:#60a5fa;
            text-decoration:none;
            font-size:16px;
        }
        .file-item a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <h1>📚 文档总目录</h1>
    <div class="nav-box">
        <a href="/note.html">📝 在线笔记</a>
    </div>

    <div class="tree">
        <!-- 一级目录：文档 -->
        <div class="tree-item">
            <div class="tree-toggle" onclick="toggle(this)">📁 文档</div>
            <div class="tree-children">
                <!-- 二级：粉笔 -->
                <div class="tree-item">
                    <div class="tree-toggle" onclick="toggle(this)">📂 粉笔</div>
                    <div class="tree-children">
                        <!-- 三级：言语 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 言语</div>
                            <div class="tree-children">
                                <div class="file-item">
                                    <span class="pdf-icon">📄</span>
                                    <a target="_blank" href="https://pdf.zx-jx.top/book/yanyu1.pdf">yanyu1.pdf</a>
                                </div>
                                <!-- 在这里继续添加言语分类PDF -->
                            </div>
                        </div>
                        <!-- 三级：资料 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 资料</div>
                            <div class="tree-children">
                                <!-- 资料PDF放这里 -->
                            </div>
                        </div>
                        <!-- 三级：数量 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 数量</div>
                            <div class="tree-children">
                                <!-- 数量PDF放这里 -->
                            </div>
                        </div>
                        <!-- 三级：常识 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 常识</div>
                            <div class="tree-children">
                                <!-- 常识PDF放这里 -->
                            </div>
                        </div>
                        <!-- 三级：政治 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 政治</div>
                            <div class="tree-children">
                                <!-- 政治PDF放这里 -->
                            </div>
                        </div>
                        <!-- 三级：申论 -->
                        <div class="tree-item">
                            <div class="tree-toggle" onclick="toggle(this)">📄 申论</div>
                            <div class="tree-children">
                                <!-- 申论PDF放这里 -->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 二级：红1 -->
                <div class="tree-item">
                    <div class="tree-toggle" onclick="toggle(this)">📂 红1</div>
                    <div class="tree-children">
                        <!-- 红1的PDF放这里 -->
                    </div>
                </div>
                <!-- 二级：红2 -->
                <div class="tree-item">
                    <div class="tree-toggle" onclick="toggle(this)">📂 红2</div>
                    <div class="tree-children">
                        <!-- 红2的PDF放这里 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
function toggle(el){
    const child = el.nextElementSibling;
    child.classList.toggle("open");
}
</script>
</body>
</html>
