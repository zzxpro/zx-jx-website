<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线笔记</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}
body{
    background:#1a1a1a;
    color:#eee;
    padding:20px;
    font-family:system-ui;
    min-height:100vh;
}
#password-box{
    max-width:420px;
    margin:80px auto;
    text-align:center;
}
#password-box h2{
    margin-bottom:12px;
}
#password-box input{
    padding:10px;
    width:260px;
    border-radius:6px;
    border:none;
    margin-right:8px;
    font-size:16px;
}
#password-box button{
    padding:10px 16px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-size:16px;
    background:#4285f4;
    color:white;
}
#password-box button:hover{
    background:#336fcf;
}
</style>
</head>
<body>
    <div id="password-box">
        <h2>🔐 请输入访问密码</h2>
        <br>
        <input id="pwdInput" type="password" placeholder="输入密码">
        <button onclick="checkPassword()">确认</button>
    </div>

<script>
// ==========【在这里修改参数】==========
const PASSWORD = "552661";  // 网页页面密码（你自定义）
// 替换成你的金山文档链接，?password=后面写你在金山文档设置的文档密码
const DOC_URL = "https://docs.qq.com/doc/DQVhwSVdCRktxYVNz";
// =====================================

function checkPassword(){
    const pwd = document.getElementById("pwdInput").value.trim();
    if(pwd === PASSWORD){
        // _blank：在新标签页打开金山文档
        window.open(DOC_URL,"_blank");
    }else{
        alert("密码错误！");
    }
}
</script>
</body>
</html>
